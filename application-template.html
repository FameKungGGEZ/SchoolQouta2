<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f7;--pn:#fff;--tx:#202a3a;--mu:#687487;--ln:#e7dfe4;--ac:#182746;--ac2:#f8e9ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--pn:#20283a;--tx:#f7e9ef;--mu:#b6afbb;--ln:#3a4051;--ac:#d58ca7;--ac2:#302636}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Sarabun,sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;max-width:1300px;margin:0 auto;padding:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;color:var(--ac)}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
input[readonly]{opacity:.7}
.r{display:grid;gap:8px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.hint{font-size:13px;color:var(--mu);margin:0 0 8px}
.room{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.room.on{border-color:var(--ac);background:var(--ac2)}
.room input{width:auto}
.rk{background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px;flex:none}
.sc{border:1px solid var(--ac);border-radius:8px;padding:10px;margin:0 0 10px;background:var(--ac2)}
.sc b{display:block}
.g5{display:grid;grid-template-columns:repeat(5,1fr) 1.2fr;gap:4px}
.g5 span{font-size:11px;color:var(--mu);text-align:center}
.g5 input{padding:5px 2px;text-align:center}
.av{display:grid;place-items:center;font-weight:700}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;width:100%}
.paperwrap{overflow-x:auto}
#doc{color:#000;width:210mm;margin:0 auto;font-size:11.5pt;line-height:1.75}.pg{background:#fff;padding:12mm 14mm;min-height:297mm;margin:0 0 14px;box-shadow:0 2px 14px #0003}
#doc .top{display:flex;justify-content:space-between;align-items:flex-start}
#doc .ph{width:3cm;height:4cm;border:1.5px solid #000;display:grid;place-items:center;text-align:center;font-size:10pt;overflow:hidden}
#doc .ph img{width:100%;height:100%;object-fit:cover}
#doc h1{line-height:1.6;font-size:12.5pt;text-align:center;margin:0;line-height:1.5}
.dt{line-height:1.35;border-bottom:1px dotted #000;padding:0 4px;display:inline-block;min-width:40px;text-align:center}
.crest{width:84px;height:84px;display:block;margin:0 auto 4px;object-fit:contain}
table{line-height:1.35;border-collapse:collapse;width:100%;margin:10px 0;font-size:10pt}
td,th{border:1.2px solid #000;text-align:center;padding:2px;height:22px}
.gy{background:#bdbdbd}.fl{display:flex;align-items:baseline;gap:5px;white-space:nowrap}.fd{line-height:1.35;flex:1;border-bottom:1px dotted #000;text-align:center;min-height:1.35em}table{table-layout:fixed}.stars{overflow:hidden;white-space:nowrap;margin:6px 0 4px;letter-spacing:1px}
.pb{border:1.2px solid #000;display:inline-block;min-width:60px;padding:0 6px;font-weight:700;line-height:1.3;text-align:center}
.chk{display:inline-block;width:13px;height:13px;border:1.2px solid #000;vertical-align:middle;margin-right:10px}
@media print{body{background:#fff}.wrap{display:block;padding:0}.panel,.noprint{display:none}#doc{box-shadow:none;margin:0}@page{size:A4;margin:12mm 14mm}#doc{width:auto}.pg{padding:0;min-height:0;margin:0;box-shadow:none;break-after:page}.pg:last-child{break-after:auto}table,h3{break-inside:avoid}h3{break-after:avoid}}

<div class="wrap">
<div class="noprint" id="form">
<div class="panel"><h2>ข้อมูลส่วนตัว</h2>
<label>ลำดับที่สมัคร</label><input id="seq" inputmode="numeric" placeholder="เช่น 7">
<label>รูปถ่ายหน้าตรง ชุดนักเรียน (3×4 ซม.)</label><input type="file" id="photo" accept="image/*">

<div class="r c3"><div><label>ชั้น ม.3/</label><select id="room"><option value="">ห้อง</option></select></div>
<div><label>เลขที่</label><input id="no" inputmode="numeric"></div>
<div><label>เลขประจำตัว (จากระบบ)</label><input id="sid" value="12345" readonly></div></div>
<label>คะแนนเฉลี่ยสะสมทุกรายวิชา ม.1–ม.3 (5 ภาคเรียน)</label><input id="gpa" inputmode="decimal" placeholder="เช่น 3.52"></div>
<div class="panel"><h2>ที่อยู่</h2>
<div class="r c3"><div><label>บ้านเลขที่</label><input id="a_h"></div><div><label>หมู่</label><input id="a_m"></div><div><label>ถนน</label><input id="a_r"></div></div>
<div class="r c2"><div><label>ตำบล</label><input id="a_t"></div><div><label>อำเภอ</label><input id="a_a"></div><div><label>จังหวัด</label><input id="a_p"></div><div><label>โทรศัพท์</label><input id="a_tel" inputmode="tel"></div></div></div>
<div class="panel"><h2>เลือกแผนการเรียน</h2><p class="hint">เลือกได้ 2 อันดับ (อันแรกที่กดคืออันดับ 1) — ติ๊กออกเพื่อเปลี่ยนห้อง</p>

 drawScores();doc();}

 $('scores').innerHTML=S.sel.map((i,o)=>{const p=P[i];
